name: Quality Gate

on:
  pull_request:
    branches:
      - ai-lab
  push:
    branches:
      - ai-lab

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/verify.sh
